<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EclessySoft - Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="titulo-principal">EclessySoft</h1>
  <p class="subtitulo">SISTEMA DE GESTIÓN DE IGLESIAS</p>

  <div class="card">
    <h2>Bienvenido</h2>
    <p class="inicia">Inicia sesión</p>

    <label>Rol</label>
    <select id="rol">
      <option>Administrador</option>
      <option>Secretario</option>
      <option>Tesorero</option>
    </select>

    <label>Correo electrónico</label>
    <input type="email" id="correo" placeholder="ejemplo@iglesia.com">

    <label>Contraseña</label>
    <div class="password-box">
      <input type="password" id="clave" placeholder="********">
      <button type="button" id="verClave">👁️</button>
    </div>

    <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>

    <button id="btnIngresar" class="btn-ingresar">Ingresar →</button>

    <p class="registro">¿No tienes una cuenta? <b>Regístrate aquí</b></p>
  </div>

  <p class="footer">© 2026 EclessySoft. Todos los derechos reservados.</p>

  <script src="script.js"></script>
</body>
</html>
